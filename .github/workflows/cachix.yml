concurrency:
  cancel-in-progress: false
  group: cachix
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: valeratrades
          skipPush: true
      - run: nix build -L '.#packages.x86_64-linux.default'
      - run: cachix push valeratrades ./result
  cached:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git push --force origin HEAD:refs/heads/cached
name: cachix
on:
  push:
    branches:
      - master
  workflow_dispatch: {}
